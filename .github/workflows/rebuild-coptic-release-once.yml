name: One-time canonical Coptic release regeneration
on:
  push:
    branches: [refactor/standalone-coptic-keyboard-api-20261025]
    paths: ['.github/workflows/rebuild-coptic-release-once.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - name: Recompile exact pinned KELLIA and SCRIPTORIUM editions (verified regression)
        run: |
          set -euo pipefail
          python tools/rebuild_release.py --write
          python tools/rebuild_release.py --check
          python -m unittest discover -s tests -p 'test_*.py' -v
          npm test
          npm pack --dry-run --json >/tmp/coptic-package-audit.json
      - name: Commit verified master and retire the one-off workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/rebuild-coptic-release-once.yml
          git add release/lexicon.json release/lexicon.sqlite3 release/coverage.json release/manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild canonical Coptic master with unique TEI lemma identities and verified browser projection'
          git push origin HEAD:refactor/standalone-coptic-keyboard-api-20261025
