name: Apply validated standalone Coptic PWA patch
on:
  push:
    branches:
      - feat/standalone-coptic-pwa-20261025
    paths:
      - .github/workflows/apply-standalone.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: true}
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Verify patch SHA-256 and extract complete audited source
        run: |
          set -euo pipefail
          cat .migration/segment-{01,02,03,04,05,06,07}.b64 | tr -d '\n' | base64 -d > /tmp/coptic-standalone-patch.tar.gz
          echo '025cc4d8bf13866f8fed00eef675c5da6dc080625912945961c1bfdc6d258209  /tmp/coptic-standalone-patch.tar.gz' | sha256sum -c -
          tar -tzf /tmp/coptic-standalone-patch.tar.gz | while IFS= read -r p; do
            case "$p" in /*|../*|*/../*|*/..) echo "Invalid tar path $p";exit 1;; esac
          done
          tar -xzf /tmp/coptic-standalone-patch.tar.gz
          git rm -f --ignore-unmatch src/predict.mjs src/publish_coptic_release.py tools/isolate_keyboard.py tests/predict.test.mjs tests/isolated_keyboard.test.mjs docs/UPSTREAM_SOURCE.md
      - name: Prove canonical release unchanged and app independently tested
        run: |
          set -euo pipefail
          python tools/verify_release.py
          node --test tests/*.test.mjs
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/build_app.py
          node --check src/app.mjs
          node --check src/_generic_search.mjs
          test -s dist/coptic-lexicon/lexicon.json
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
      - name: Publish tested independent source without deployment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf --ignore-unmatch .migration
          git rm -f --ignore-unmatch .github/workflows/apply-standalone.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Implement standalone offline Coptic PWA and streamlined source-backed predictor'
          git push origin HEAD:feat/standalone-coptic-pwa-20261025
