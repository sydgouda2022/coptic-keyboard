name: Coptic keyboard app — source, PWA and mobile browser QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify KELLIA / Scriptorium release against canonical SQLite and JSON
        run: python tools/verify_release.py
      - name: Full native Coptic API, editor, compiler and installer tests
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.mjs
          node --check web/app.mjs
      - name: Rebuild from exact pinned open TEI and check published catalog byte equality
        run: bash tools/rebuild_release.sh
      - name: Build installable and immutable-cache-versioned Coptic PWA
        run: |
          set -euo pipefail
          python tools/build_app.py
          test -s dist/coptic-lexicon/lexicon.json
          test -s dist/keyboard-search.mjs
          test -s dist/editor.mjs
          ! grep -q 'coptic-keyboard-v1' dist/sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-coptic-keyboard-pwa
          path: dist/
          if-no-files-found: error
          retention-days: 14
  mobile-browser:
    needs: audit-build
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Compile offline app and install Chromium/WebKit engines
        run: |
          set -euo pipefail
          python tools/build_app.py
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run Safari-like WebKit and Chromium native input/offline tests
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/coptic-qa-server.log 2>&1 &
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser.mjs
