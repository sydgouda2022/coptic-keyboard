name: Coptic Keyboard — headless API, release and consumer integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Enforce UI-free pure JavaScript API and source-backed lexicon
        run: |
          set -euo pipefail
          test ! -e web
          test ! -e styles
          test ! -e examples
          test ! -e src/app.mjs
          test ! -e src/keyboard.mjs
          test ! -e src/coptic_install.mjs
          test ! -e src/_generic_search.mjs
          test ! -e tools/build_app.py
          python tools/verify_release.py
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v
          npm test
      - name: Benchmark full lexicon with generous regression bounds
        env:
          COP_BENCH_ENFORCE: '1'
        run: node tools/benchmark.mjs
      - name: Rebuild pinned master, verify sources, and reject nonreproducible releases
        run: |
          set -euo pipefail
          python tools/rebuild_release.py --check
          git diff --exit-code -- release
      - name: Pack and run a clean third-party consumer (JS and TypeScript)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coptic-consumer"
          npm pack --pack-destination "$RUNNER_TEMP/coptic-consumer"
          cd "$RUNNER_TEMP/coptic-consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-package-lock \
            ./sydgouda2022-coptic-keyboard-2.0.0.tgz typescript@5.9.3
          cp "$GITHUB_WORKSPACE/tests/type-consumer.mts" ./consumer.mts
          npx tsc --strict --noEmit --target ES2022 --module NodeNext \
            --moduleResolution NodeNext consumer.mts
          cat > consumer.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import * as lib from '@sydgouda2022/coptic-keyboard';
          import * as predict from '@sydgouda2022/coptic-keyboard/prediction';
          import * as editing from '@sydgouda2022/coptic-keyboard/editing';
          import * as lexicon from '@sydgouda2022/coptic-keyboard/lexicon';
          import catalog from '@sydgouda2022/coptic-keyboard/data/lexicon.json' with {type:'json'};
          import manifest from '@sydgouda2022/coptic-keyboard/data/manifest.json' with {type:'json'};
          assert.equal(lib.COPTIC_KEYS.length,32);
          assert.equal(typeof predict.predictKeyboard,'function');
          assert.equal(typeof editing.applyKey,'function');
          assert.equal(lexicon.validateManifest(manifest).language,'cop');
          assert.equal(lib.createCopticKeyboard(catalog).suggest('ⲡ')[0].text,'ⲡ');
          assert.equal(lib.mountCopticKeyboard,undefined);
          assert.equal(lib.ensureCopticLexicon,undefined);
          console.log('Clean external consumer: OK');
          EOF
          node consumer.mjs

  node-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Run frozen v2 contract and Unicode edge cases on supported Node versions
        run: |
          set -euo pipefail
          npm test
          node tools/benchmark.mjs
