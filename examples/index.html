<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coptic Keyboard — standalone demo</title>
<link rel="stylesheet" href="../styles/keyboard.css">
<style>
 body{margin:0;background:#f7f5ef;font:16px system-ui,sans-serif;color:#1b3430}
 main{max-width:740px;margin:auto;padding:1rem}
 textarea{width:100%;min-height:5rem;border:1px solid #809b8e;border-radius:.6rem;padding:.75rem;
  box-sizing:border-box;font-size:1.5rem;resize:vertical}
 #status{min-height:1.3rem;font-size:.85rem;color:#49665c}
</style></head><body>
<main><h1>Coptic Keyboard</h1><p>Independent, offline Unicode input and Coptic dictionary suggestions.</p>
<label for="sample">Coptic text</label>
<textarea id="sample" lang="cop" autocomplete="off" spellcheck="false"></textarea>
<p id="status" role="status"></p><div id="keyboard"></div>
</main>
<script type="module">
import {mountCopticKeyboard} from '../src/index.mjs';
const input=document.getElementById('sample');
const panel=document.getElementById('keyboard');
const widget=mountCopticKeyboard({target:input,mount:panel});
window.demoKeyboard=widget;
try{
 const response=await fetch('../release/lexicon.json');
 if(!response.ok)throw Error('HTTP '+response.status);
 const lexicon=await response.json();
 widget.setLexicon(lexicon);
 document.getElementById('status').textContent='Source-compiled Coptic lexicon ready.';
}catch(error){
 document.getElementById('status').textContent='Unicode typing available; lexicon unavailable: '+error.message;
}
</script></body></html>
